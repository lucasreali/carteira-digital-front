        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

# ═════════════════════════ COMPONENTS ═════════════════════════

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Envie: `Authorization: Bearer <access_token>`. TTL de 15 minutos."

  parameters:

    WalletId:
      name: walletId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave única por operação. Reenvio com a mesma chave devolve a resposta original.
      schema:
        type: string
        maxLength: 64
      example: trf_2026-08-24_ana_007

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Lock otimista. Use o `version` atual do recurso.
      schema:
        type: string
      example: "12"

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `pagination.next_cursor`.
      schema:
        type: string
      example: eyJpZCI6IjVkNGMzYjJhIn0

  responses:

    BadRequest:
      description: Requisição malformada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: bad_request
              message: O corpo da requisição é inválido.
              details:
                - field: amount
                  issue: "deve ser um inteiro positivo em centavos"
              trace_id: 01J9X7QK3M2R6T

    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Token de acesso expirado.
              details: []
              trace_id: 01J9X7QK3M2R6T

    Forbidden:
      description: Sem permissão sobre o recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Você não tem permissão para acessar esta carteira.
              details: []
              trace_id: 01J9X7QK3M2R6T

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Recurso não encontrado.
              details: []
              trace_id: 01J9X7QK3M2R6T

    Conflict:
      description: Conflito de estado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: O recurso está em um estado que não permite esta operação.
              details: []
              trace_id: 01J9X7QK3M2R6T

    IdempotencyConflict:
      description: Idempotency-Key reutilizada com payload diferente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: idempotency_key_reuse
              message: Esta Idempotency-Key já foi usada com um payload diferente.
              details:
                - field: Idempotency-Key
                  issue: trf_2026-08-24_ana_007
              trace_id: 01J9X7QK3M2R6T

    InsufficientFunds:
      description: Saldo insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: insufficient_funds
              message: Saldo insuficiente para concluir a operação.
              details:
                - field: amount
                  issue: "solicitado: 75000, disponível: 52340"
              trace_id: 01J9X7QK3M2R6T

    UnprocessableEntity:
      description: Semanticamente inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: Não foi possível processar os dados enviados.
              details:
                - field: document
                  issue: "CPF inválido"
              trace_id: 01J9X7QK3M2R6T

    TooManyRequests:
      description: Rate limit excedido
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos até liberar.
        X-RateLimit-Remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limit_exceeded
              message: Muitas requisições. Tente novamente em instantes.
              details:
                - field: retry_after
                  issue: "30"
              trace_id: 01J9X7QK3M2R6T

    InternalError:
      description: Erro interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Erro inesperado. Nossa equipe foi notificada.
              details: []
              trace_id: 01J9X7QK3M2R6T

  schemas:

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Código estável, legível por máquina.
              example: insufficient_funds
            message:
              type: string
              description: Mensagem legível por humano (pode mudar).
              example: Saldo insuficiente para concluir a operação.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            trace_id:
              type: string
              description: Use no suporte para rastrear a requisição.
              example: 01J9X7QK3M2R6T

    Pagination:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          example: eyJpZCI6IjVkNGMzYjJhIn0
        has_more:
          type: boolean
          example: true
        limit:
          type: integer
          example: 20

    RegisterRequest:
      type: object
      required: [full_name, email, document, password]
      properties:
        full_name:
          type: string
          minLength: 3
          example: Ana Souza
        email:
          type: string
          format: email
          example: ana.souza@example.com
        document:
          type: string
          description: CPF ou CNPJ, apenas dígitos.
          example: "39053344705"
        phone:
          type: string
          example: "+5541999998888"
        password:
          type: string
          format: password
          minLength: 10
          example: "S3nh@ForteAqui"
        birth_date:
          type: string
          format: date
          example: "1993-04-17"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_id:
          type: string

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Segundos de validade do access token.
          example: 900

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        document_masked:
          type: string
          description: CPF/CNPJ sempre mascarado na saída.
          example: "390.***.***-05"
        phone:
          type: string
        status:
          type: string
          enum: [active, blocked, closing, closed]
        kyc_status:
          type: string
          enum: [pending, in_review, approved, rejected]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer

    UpdateUserRequest:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
        current_password:
          type: string
          format: password
          description: Obrigatório ao alterar `password` ou `email`.

    Kyc:
      type: object
      properties:
        status:
          type: string
          enum: [pending, in_review, approved, rejected]
        level:
          type: integer
          description: 0 = não verificado, 1 = básico, 2 = completo.
        submitted_at:
          type: string
          format: date-time
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        limits:
          type: object
          properties:
            daily_transfer_limit:
              type: integer
            nightly_transfer_limit:
              type: integer

    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        alias:
          type: string
        currency:
          type: string
          example: BRL
        available_balance:
          type: integer
          description: Centavos disponíveis para uso.
        blocked_balance:
          type: integer
          description: Centavos retidos (cautelar, saque em curso).
        total_balance:
          type: integer
        is_default:
          type: boolean
        status:
          type: string
          enum: [active, frozen, closed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer

    CreateWalletRequest:
      type: object
      required: [alias, currency]
      properties:
        alias:
          type: string
          maxLength: 40
        currency:
          type: string
          enum: [BRL, USD, EUR]
        is_default:
          type: boolean
          default: false

    UpdateWalletRequest:
      type: object
      properties:
        alias:
          type: string
          maxLength: 40
        is_default:
          type: boolean
        status:
          type: string
          enum: [active, frozen]

    Balance:
      type: object
      properties:
        wallet_id:
          type: string
          format: uuid
        currency:
          type: string
        available_balance:
          type: integer
        blocked_balance:
          type: integer
        pending_credits:
          type: integer
          description: Créditos aguardando compensação (não somados ao total).
        total_balance:
          type: integer
        updated_at:
          type: string
          format: date-time

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [deposit, withdrawal, transfer, pix_in, pix_out, reversal, fee]
        status:
          type: string
          enum: [pending, processing, completed, failed, reversed, canceled]
        amount:
          type: integer
          description: Valor bruto em centavos.
        fee:
          type: integer
        net_amount:
          type: integer
        currency:
          type: string
        source_wallet_id:
          type: string
          format: uuid
          nullable: true
        destination_wallet_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    StatementEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        type:
          type: string
          example: transfer_in
        direction:
          type: string
          enum: [credit, debit]
        amount:
          type: integer
        balance_after:
          type: integer
        description:
          type: string
        created_at:
          type: string
          format: date-time

    DepositRequest:
      type: object
      required: [amount, method]
      properties:
        amount:
          type: integer
          minimum: 100
        method:
          type: string
          enum: [pix, card, boleto]
        payment_method_id:
          type: string
          nullable: true
          description: Obrigatório quando `method = card`.
        description:
          type: string

    WithdrawalRequest:
      type: object
      required: [amount, payment_method_id]
      properties:
        amount:
          type: integer
          minimum: 100
        payment_method_id:
          type: string
        description:
          type: string

    TransferRequest:
      type: object
      required: [source_wallet_id, amount]
      properties:
        source_wallet_id:
          type: string
          format: uuid
        destination_wallet_id:
          type: string
          format: uuid
        destination_email:
          type: string
          format: email
        destination_document:
          type: string
        amount:
          type: integer
          minimum: 1
        description:
          type: string
          maxLength: 140
        scheduled_for:
          type: string
          format: date-time
          nullable: true
          description: Se preenchido, a transação nasce `pending` e executa na data.

    PixPaymentRequest:
      type: object
      required: [source_wallet_id]
      properties:
        source_wallet_id:
          type: string
          format: uuid
        pix_key:
          type: string
        qr_code:
          type: string
          description: Payload copia-e-cola (EMV).
        amount:
          type: integer
          description: Obrigatório com `pix_key`; opcional com QR de valor fixo.
        description:
          type: string
          maxLength: 140

    PixKey:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [cpf, cnpj, email, phone, random]
        value:
          type: string
        wallet_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, pending_portability, inactive]
        created_at:
          type: string
          format: date-time

    PixCharge:
      type: object
      properties:
        id:
          type: string
        wallet_id:
          type: string
          format: uuid
        amount:
          type: integer
        status:
          type: string
          enum: [active, paid, expired, canceled]
        qr_code:
          type: string
        qr_code_image_url:
          type: string
          format: uri
        description:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        transaction_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [card, bank_account]
        is_default:
          type: boolean
        status:
          type: string
          enum: [pending_verification, verified, rejected, expired]
        bank_account:
          nullable: true
          type: object
          properties:
            bank_code:
              type: string
            bank_name:
              type: string
            agency:
              type: string
            account_masked:
              type: string
            account_type:
              type: string
              enum: [checking, savings]
            holder_document_masked:
              type: string
        card:
          nullable: true
          type: object
          properties:
            brand:
              type: string
              example: visa
            last4:
              type: string
              example: "4242"
            exp_month:
              type: integer
            exp_year:
              type: integer
            holder_name:
              type: string
        created_at:
          type: string
          format: date-time

    CreatePaymentMethodRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [card, bank_account]
        is_default:
          type: boolean
          default: false
        card_token:
          type: string
          description: Token do gateway. Nunca envie PAN, CVV ou validade em claro.
        bank_account:
          type: object
          properties:
            bank_code:
              type: string
            agency:
              type: string
            account_number:
              type: string
            account_digit:
              type: string
            account_type:
              type: string
              enum: [checking, savings]

    Beneficiary:
      type: object
      properties:
        id:
          type: string
        nickname:
          type: string
        full_name:
          type: string
        document_masked:
          type: string
        pix_key:
          type: string
          nullable: true
        bank_code:
          type: string
          nullable: true
        is_favorite:
          type: boolean
        created_at:
          type: string
          format: date-time

    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        secret_masked:
          type: string
        created_at:
          type: string
          format: date-time
